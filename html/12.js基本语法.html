<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js基本语法</title>
</head>
<body>
    <script>
        var x='x';
        let y=5,empty="null",Empty=null;
        const pi=3.14;
        console.log(x,y,empty,Empty,pi);

        console.log('for循环');
        for(var i=0;i<=10;i++){
            // var j=i.toString();
            var j=String(i);
            // var j=i+'';
            console.log(j);
        }
        let t=10;
        while(x=='x'&&t>=0){
            console.log((t--).toString());
        }

        
    </script>
