<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css浮动</title>
    <style>
        .father{
            background-color: aquamarine;
            /* height: 200px; */
            width: 600px;
            border: 3px solid rgb(209, 25, 209);
            /* overflow: hidden; */
        }
        .father::after{
            content: "";
            display: table;
            clear: both;
        }
        .father:hover{
            background-color: brown;
        }
        .left-son{
            width: 100px;
            height: 100px;
            background-color: yellowgreen;
            float:left;
        }
        .right-son{
            width: 100px;
            height: 100px;
            background-color: yellow;
            float: right;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="left-son">左浮动</div>
        <div class="right-son">右浮动</div>
    </div>
    <p>这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本</p>
</body>
</html>
