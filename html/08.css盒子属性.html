<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css盒子属性</title>
    <style>
        .demo{
                background-color: aqua;
                display: inline-block;
                border:6px double rgb(14, 28, 224);
                margin: 10px;
                padding: 50px;

        }
        .border-demo{
            background-color: yellow;
            width: 300px;
            height: 100px;
            font:20px 'KaiTi' ;
            border-style: solid;
            border-width: 10px;
            border-color: brown;
            margin: 20px ;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="demo">Robert丿男人</div>
    <hr>
    <div class="border-demo">这是一个边框示例</div>
</body>
</html>
