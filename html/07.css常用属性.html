<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css常用属性</title>
    <style>
        .block{
            background-color: aqua;
            width: 200px;
            height: 50px;
        }
        .inline{
            background-color: blueviolet;
            width: 300px;
            height: 600px;
        }
        .inline-block{
            background-color: burlywood;
            height:100px;
            width:50px;
        }
        .div-inline{
            display: inline;
            background-color: blue;
        }
        .span-inline-block{
            display:inline-block;
            background-color: aquamarine;
            height: 100px;
            width: 100px;
        }
    </style>
</head>

<body>
    <h1 style="font:36px 'kaiti';color: brown;">这是一个font复合属性示例</h1>
    <p style="line-height:20px ;font: 36px;">这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一段文本这是一
        段文本这是一段文本这是一段文本这是一段文本</p>
    
    <div class="block">这是一个块元素</div>
    <span class="inline">这是一个行内元素</span>
    <img class="inline-block" src="../assets/aminos.png" alt="" >
    <img class="inline-block" src="../assets/aminos.png" alt="" >
    <img class="inline-block" src="../assets/aminos.png" alt="" >

    <h2>display</h2>
    <div class="div-inline">这是一个转换成行内元素的div标签</div>
    <span class="span-inline-block">这是一个转换成行内块元素的span标签</span>
</body>
</html>
