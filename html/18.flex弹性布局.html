<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex弹性盒子</title>
    <style>
        html{
            font-size: 10px;
        }
        .container{
            background-color: aqua;
            display: flex;
            height: 40rem;
            /* flex-direction: row; */
            flex-wrap:wrap;
            /* justify-content: space-evenly; */
            /* align-items:center; */
            align-content: stretch;
        }
        .item{
            width: 20rem;
            font-size: 8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" style="background-color: red;">1</div>
        <div class="item" style="background-color: grey;">2</div>
        <div class="item" style="background-color: yellow;">3</div>
        <div class="item" style="background-color: indianred;">4</div>
        <div class="item" style="background-color: orange;">5</div>
        <div class="item" style="background-color: khaki;">6</div>
    </div>
</body>
</html>
