<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复制粘贴实战</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background: #f5f5f5; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 400px; }
        input { padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-weight: bold; }
        .btn-modern { background-color: #3498db; }
        .btn-legacy { background-color: #e67e22; }
        .msg { margin-top: 10px; font-size: 14px; color: green; min-height: 20px; }
    </style>
</head>
<body>

    <h2>复制粘贴实战演示</h2>

    <!-- 场景1：现代 Clipboard API -->
    <div class="card">
        <h3>1. 现代方案 (Clipboard API)</h3>
        <input type="text" id="modernInput" value="Hello, 现代前端!">
        <button class="btn-modern" id="modernBtn">点击复制</button>
        <div class="msg" id="modernMsg"></div>
    </div>

    <!-- 场景2：传统兼容方案 (execCommand) -->
    <div class="card">
        <h3>2. 兼容方案 (execCommand)</h3>
        <input type="text" id="legacyInput" value="Hello, 老版本浏览器!">
        <button class="btn-legacy" id="legacyBtn">点击复制</button>
        <div class="msg" id="legacyMsg"></div>
    </div>

    <!-- 场景3：图片复制  -->
     <div class="card">
        <h3>3.  图片复制</h3>
        <img id="image" src="../assets/aminos.png" alt="none" width="300px" style="display: block;">
        <button id="copyImageBtn" style="background-color: #3498db;margin-top: 5px;">复制图片</button>
        <div id="imageMsg" style="margin-top:10px; color:rgb(16, 235, 16);"></div>
     </div>
    


    <!-- 引入外部 JS 文件 -->
    <script src="../js/23.剪贴板-三种复制方案.js"></script>
</body>
</html>
